name: Linux ThreadSanitizer

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Image'
        required: true
        type: string
      llvm_version:
        description: 'LLVM Version'
        required: true
        type: string
      ubuntu_base:
        description: 'Ubuntu Base'
        required: true
        type: string

jobs:
  tsan:
    name: Base tests (TSan)
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup build environment
        run: |-
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/${{ inputs.ubuntu_base }}/ llvm-toolchain-${{ inputs.ubuntu_base }}-${{ inputs.llvm_version }} main"
          sudo apt-get -y update
          # libclang-rt provides the TSan runtime; Ubuntu's clang packages
          # don't always pull it in.
          sudo apt-get -y install libc++-dev libc++abi-dev libgtk-3-dev libsdl2-dev libvulkan-dev libx11-xcb-dev clang-${{ inputs.llvm_version }} lld-${{ inputs.llvm_version }} libclang-rt-${{ inputs.llvm_version }}-dev

      - name: Download submodules
        run: |- # Exclude unneeded submodules
          SUBMODULES=$(grep -oP '(?<=path = )(?!third_party\/(?:DirectX(?:-Headers|ShaderCompiler)|xbyak_aarch64)).+' .gitmodules)
          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $SUBMODULES

      # Debug for readable stacks. Any report fails the job (TSan exits 66);
      # known, tracked problems are listed in .github/tsan_suppressions.txt.
      # PhysicalHeap vE0000000 AllocRange alignment is excluded on Linux until
      # PhysicalHeap checks alignment on the physical address (same exclusion
      # as the main Linux test step).
      - name: Build and run base tests under TSan
        env:
          CC: clang-${{ inputs.llvm_version }}
          CXX: clang++-${{ inputs.llvm_version }}
          TSAN_OPTIONS: >-
            halt_on_error=0
            second_deadlock_stack=1
            print_suppressions=1
            suppressions=${{ github.workspace }}/.github/tsan_suppressions.txt
        run: >-
          ./xenia-build.py test --config=Debug --target=xenia-base-tests
          --cmake-define "CMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          --cmake-define "CMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          --cmake-define "CMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"
          -- "~PhysicalHeap vE0000000 AllocRange alignment"
