name: Fork CI

# Fork-only (Ecredes/xenia-canary); never propose upstream.
#
# Upstream's Orchestrator runs from each pushed branch's own workflow files, so
# it can only use a compiler cache if the branch carries CI changes. This
# workflow lives on the fork's default branch instead. workflow_run always runs
# the default branch's copy, so it runs for every push to any branch: it cancels
# that push's Orchestrator run and lints and builds the same commit with ccache.
# Runs started this way use the default branch's cache scope, so every branch
# can restore any branch's compiler cache. Each build restores the cache of
# the built commit closest to it, so a stacked branch starts from the branch
# below it rather than from fork-ci (fork issue #63).
#
# It builds with copies of upstream's workflows, so it can't see changes to
# them. Setup warns, and the commit status says so, when the commit's
# Orchestrator/Lint/Linux_x86/Windows_x86.yml differ from the synced versions
# recorded in SYNCED below (fork issue #25).

on:
  workflow_run:
    workflows: [Orchestrator]
    types: [requested]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build'
        required: true
        type: string

permissions:
  actions: write
  contents: read
  statuses: write

# One group per branch, so a newer push or dispatch cancels the older build and
# the commit status always comes from the newest run. A pull_request
# Orchestrator run starts this workflow only to skip it, so it gets a group of
# its own and can't cancel the branch's build.
concurrency:
  group: fork-ci-${{ github.event.workflow_run.event == 'pull_request' && github.run_id || github.event.workflow_run.head_branch || inputs.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    if: |-
      github.repository == 'Ecredes/xenia-canary' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      branch: ${{ github.event.workflow_run.head_branch || inputs.ref }}
      drift: ${{ steps.drift.outputs.drift }}
      save_cache: ${{ steps.resolve.outputs.save_cache }}
      linux_cache: ${{ steps.caches.outputs.linux }}
      windows_cache: ${{ steps.caches.outputs.windows }}
      fork_ci_sha: ${{ steps.caches.outputs.fork_ci_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      INPUT_REF: ${{ inputs.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Cancel the Orchestrator run
        if: ${{ github.event_name == 'workflow_run' }}
        run: gh run cancel "$RUN_ID" -R "$REPO" || true

      - name: Resolve commit
        id: resolve
        run: |-
          if [ -n "$HEAD_SHA" ]; then
            sha="$HEAD_SHA"
          else
            sha=$(gh api "repos/$REPO/commits/$INPUT_REF" -q .sha)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # fork-ci builds always save the compiler caches; other builds save
          # them only when they compiled much (fork issues #29, #63).
          if [ "$HEAD_BRANCH" = fork-ci ] || [ "$INPUT_REF" = fork-ci ]; then
            echo "save_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "save_cache=false" >> "$GITHUB_OUTPUT"
          fi
          gh api "repos/$REPO/statuses/$sha" -f state=pending -f context="Fork CI" \
            -f description="Building" -f target_url="$RUN_URL" > /dev/null

      # The cache of the built commit closest to this one: fewest commits
      # ahead plus behind, by the compare API. For a stacked branch that is
      # the branch below it; fork-ci, which diverges from topic branches by its
      # CI commits, is the fallback.
      - name: Pick compiler caches
        id: caches
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |-
          pick() {
            local prefix=$1 best= best_score= key cand counts ahead behind score
            for key in $(gh api "repos/$REPO/actions/caches?key=$prefix&per_page=100" -q '.actions_caches[].key'); do
              cand=${key#"$prefix"}
              [ ${#cand} -eq 40 ] || continue
              counts=$(gh api "repos/$REPO/compare/$cand...$SHA" -q '"\(.ahead_by) \(.behind_by)"' 2>/dev/null) || continue
              read -r ahead behind <<< "$counts"
              score=$((ahead + behind))
              echo "$key: $ahead ahead, $behind behind" >&2
              if [ -z "$best_score" ] || [ "$score" -lt "$best_score" ]; then
                best=$key
                best_score=$score
              fi
            done
            echo "$best"
          }
          linux=$(pick Linux-ccache-)
          windows=$(pick Windows-ccache-v3-)
          echo "Linux restores ${linux:-the newest entry}, Windows ${windows:-the newest entry}"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "fork_ci_sha=$(gh api "repos/$REPO/commits/fork-ci" -q .sha)" >> "$GITHUB_OUTPUT"

      - name: Check the Fork_* copies against upstream
        id: drift
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          # Blob SHAs (git rev-parse <commit>:.github/workflows/<file>) of the
          # upstream workflows this file, Fork_Linux_x86.yml and
          # Fork_Windows_x86.yml were last synced with. Update them together
          # with the copies.
          SYNCED: |-
            Orchestrator.yml fc5130d5926c8234810cd5c032264c8ab4656a47
            Lint.yml 669929cd86094207e305bde8a8abbb5794672e66
            Linux_x86.yml a1cea2ea6ae0bbe6bf559bc21d305d15a583353c
            Windows_x86.yml dff4513c3927a7ff713c4afb9e4115d895bf3a2e
        run: |-
          drift=
          while read -r file blob; do
            current=$(gh api "repos/$REPO/contents/.github/workflows/$file?ref=$SHA" -q .sha 2>/dev/null) || current=missing
            if [ "$current" != "$blob" ]; then
              echo "::warning title=Fork CI copies out of date::$file at ${SHA::9} differs from the version the Fork_* copies were synced with, so Fork CI isn't testing it. Refresh the copies (fork issue #25)."
              drift="$drift $file"
            fi
          done <<< "$SYNCED"
          echo "drift=${drift# }" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - name: Setup
        run: |-
          UBUNTU_BASE=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-20 main"
          sudo apt-get -y update
          sudo apt-get -y install clang-format-20
      - name: Lint
        run: ./xenia-build.py lint --all

  build-windows:
    name: Windows (x86-64)
    needs: [setup, lint]
    uses: ./.github/workflows/Fork_Windows_x86.yml
    with:
      ref: ${{ needs.setup.outputs.sha }}
      save-cache: ${{ needs.setup.outputs.save_cache == 'true' }}
      restore-key: ${{ needs.setup.outputs.windows_cache }}
      keep-ref: ${{ needs.setup.outputs.fork_ci_sha }}

  build-linux:
    name: Linux (x86-64)
    needs: [setup, lint]
    uses: ./.github/workflows/Fork_Linux_x86.yml
    with:
      ref: ${{ needs.setup.outputs.sha }}
      save-cache: ${{ needs.setup.outputs.save_cache == 'true' }}
      restore-key: ${{ needs.setup.outputs.linux_cache }}
      keep-ref: ${{ needs.setup.outputs.fork_ci_sha }}

  # The headless automation image (.github/container) for automation/*
  # branches: their Linux build in ghcr.io/ecredes/xenia-headless, tagged with
  # the branch (slashes as dashes) and the commit. The package is public.
  image:
    name: Image
    needs: [setup, build-linux]
    if: startsWith(needs.setup.outputs.branch, 'automation/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ecredes/xenia-headless
      BRANCH: ${{ needs.setup.outputs.branch }}
      SHA: ${{ needs.setup.outputs.sha }}
    steps:
      # This workflow's own branch (fork-ci), where the Containerfile lives.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/container
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xenia_canary_linux.AppImage
          path: appimage
      - name: Extract the binary
        run: |-
          cd appimage
          chmod +x xenia_canary_linux.AppImage
          ./xenia_canary_linux.AppImage --appimage-extract usr/bin/xenia_canary > /dev/null
          mkdir -p ../context
          mv squashfs-root/usr/bin/xenia_canary ../context/
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |-
          tag=$(printf '%s' "$BRANCH" | tr '/' '-' | tr -c 'A-Za-z0-9_.-' '-')
          docker build -f .github/container/Containerfile \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:$tag" -t "$IMAGE:$SHA" context
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$tag"
          docker push "$IMAGE:$SHA"
          echo "Pushed $IMAGE:$tag and $IMAGE:$SHA" >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report
    needs: [setup, lint, build-windows, build-linux, image]
    if: ${{ always() && needs.setup.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.setup.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: ${{ needs.lint.result }} ${{ needs.build-windows.result }} ${{ needs.build-linux.result }} ${{ needs.image.result }}
      DRIFT: ${{ needs.setup.outputs.drift }}
      IMAGE_RESULT: ${{ needs.image.result }}
      WINDOWS_CACHEABLE: ${{ needs.build-windows.outputs.cacheable }}
    steps:
      - name: Set commit status
        run: |-
          case " $RESULTS " in
            *" failure "*) state=failure; description="Failed" ;;
            *" cancelled "*) state=error; description="Cancelled" ;;
            *) state=success; description="Lint and builds passed" ;;
          esac
          if [ "$IMAGE_RESULT" = success ]; then
            description="$description; image pushed"
          fi
          if [ -n "$DRIFT" ]; then
            description="$description; untested workflow changes: $DRIFT"
          fi
          if [ "$WINDOWS_CACHEABLE" = "false" ]; then
            description="$description; Windows not cacheable"
          fi
          description="${description:0:140}"
          gh api "repos/$REPO/statuses/$SHA" -f state=$state -f context="Fork CI" \
            -f description="$description" -f target_url="$RUN_URL" > /dev/null
