name: Fork Windows Build

# Fork-only copy of Windows_x86.yml, called by Fork_CI.yml. It builds the given
# commit with ccache and incremental LTCG. Keep its steps in sync with
# upstream's Windows_x86.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        required: true
        type: string
      save-cache:
        description: 'Always save the compiler cache (fork-ci builds); other builds save it only when cold'
        required: true
        type: boolean
      restore-key:
        description: 'Compiler cache to restore, picked by Fork_CI.yml; empty for the newest'
        required: false
        type: string
        default: ''
      keep-ref:
        description: "fork-ci's head, whose compiler cache is never deleted"
        required: false
        type: string
        default: ''
    outputs:
      cacheable:
        description: "'false' if the Release flags to rewrite weren't all found"
        value: ${{ jobs.build.outputs.cacheable }}

jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026
    outputs:
      cacheable: ${{ steps.cacheable.outputs.cacheable }}

    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK
          key: ${{ runner.os }}-vulkan-sdk-${{ hashFiles('**/vulkan-sdk.exe') }}
          restore-keys: ${{ runner.os }}-vulkan-sdk-

      - name: Install Vulkan SDK with spirv-tools
        run: |-
          if (Test-Path "C:\VulkanSDK") {
            echo "Vulkan SDK found in cache."
          } else {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
            Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -NoNewWindow -Wait
          }
          $env:VULKAN_SDK = "C:\VulkanSDK\$(Get-ChildItem -Path 'C:\VulkanSDK' -Directory | Select-Object -First 1 -ExpandProperty Name)"
          $env:PATH += "${env:VULKAN_SDK}\Bin"
          echo "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          echo "${env:VULKAN_SDK}\Bin" >> $env:GITHUB_PATH

          # Verify shader tools are available
          foreach ($tool in @("glslangValidator", "spirv-opt", "spirv-dis")) {
            $toolPath = "${env:VULKAN_SDK}\Bin\${tool}.exe"
            if (Test-Path "$toolPath") {
              echo "$tool found at: $toolPath"
              & $toolPath --version 2>$null
            } else {
              echo "Warning: ${tool}.exe not found at expected location"
            }
          }

          # Verify FXC is available (from Windows SDK)
          $fxcPaths = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName
          if ($fxcPaths) {
            $fxcPath = $fxcPaths[-1].FullName
            echo "FXC found at: $fxcPath"
          } else {
            echo "Warning: fxc.exe not found in Windows SDK"
          }

      - name: Download submodules
        run: |- # Exclude unneeded submodules
          $SUBMODULES=(Select-String -CaseSensitive '(?<=path = )(?!third_party\/xbyak_aarch64).+' .gitmodules).Matches.Value
          git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS $SUBMODULES

      # The cache Fork_CI.yml picked, the closest built commit's, or else the
      # newest (fork issues #29, #63).
      - name: Restore compiler output
        uses: actions/cache/restore@v6
        with:
          path: |
            C:\ccache
            build\bin\Windows\Release\*.iobj
            build\bin\Windows\Release\*.ipdb
          key: ${{ inputs.restore-key || format('{0}-ccache-v2-{1}', runner.os, inputs.ref) }}
          restore-keys: ${{ runner.os }}-ccache-v2-

      # The cache is only as good as the toolchain that wrote it, and runner
      # images report the same MSVC version (14.51.36231 on win25-vs2026
      # 20261007.264 and 20261018.275) with different files. On 2026-10-21:
      # - ccache's default compiler check (cl.exe's mtime) missed every object
      #   across the two images (0 of 907), so such builds compiled cold.
      # - Incremental LTCG state (.iobj/.ipdb) from the other image crashed
      #   the linker (C1001 and LNK1000 in IMAGE::BuildImage) in three builds.
      # So the toolchain is identified by the contents of its compiler, code
      # generator and linker: ccache's compiler_check is that fingerprint, and
      # LTCG state from another fingerprint is dropped (the objects stay). Both
      # live in C:\ccache, so the cache's paths, and its entries, don't change.
      - name: Fingerprint the toolchain
        run: |-
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $bin = "$vs\VC\Tools\MSVC\$version\bin\Hostx64\x64"
          $hashes = foreach ($file in 'cl.exe', 'c1.dll', 'c1xx.dll', 'c2.dll', 'link.exe') {
            (Get-FileHash -Algorithm SHA256 "$bin\$file").Hash
          }
          $sha = [Security.Cryptography.SHA256]::Create()
          $bytes = [Text.Encoding]::ASCII.GetBytes($hashes -join ' ')
          $fingerprint = -join ($sha.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') })
          echo "MSVC $version on ${env:ImageVersion}: toolchain $fingerprint"
          New-Item -ItemType Directory -Force C:\ccache | Out-Null
          # Diagnostics: the stamp read back empty on every build so far.
          Get-ChildItem C:\ccache -File | ForEach-Object { echo "restored: $($_.Name) $($_.Length) bytes" }
          $stamp = 'C:\ccache\ltcg-toolchain.txt'
          $saved = if (Test-Path $stamp) { (Get-Content $stamp -Raw).Trim() } else { '' }
          if ($saved -ne $fingerprint) {
            Remove-Item build\bin\Windows\Release\*.iobj, build\bin\Windows\Release\*.ipdb -ErrorAction SilentlyContinue
            echo "Dropped LTCG state from toolchain '$saved'"
          }
          Set-Content -NoNewline $stamp $fingerprint
          Remove-Item C:\ccache\ltcg-image.txt -ErrorAction SilentlyContinue
          Set-Content C:\ccache\ccache.conf "compiler_check = string:$fingerprint"

      - name: Install ccache
        env:
          CCACHE_VERSION: 4.11.3
        run: |-
          $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile "$env:RUNNER_TEMP\ccache.zip"
          Expand-Archive "$env:RUNNER_TEMP\ccache.zip" -DestinationPath "$env:RUNNER_TEMP"
          echo "$env:RUNNER_TEMP\$name" >> $env:GITHUB_PATH

      - name: Make Release objects cacheable
        # ccache can't cache /Zi objects, and the artifact ships without a .pdb,
        # so drop Release debug info. Incremental LTCG reuses the cached
        # .iobj/.ipdb files. Rewriting the flags works on any branch, with or
        # without the XENIA_RELEASE_DEBUG_INFO/XENIA_INCREMENTAL_LTCG options.
        # Any flag that isn't found is reported, and Fork_CI.yml notes it in
        # the commit status.
        id: cacheable
        run: |-
          $path = "CMakeLists.txt"
          $text = [IO.File]::ReadAllText($path)
          $missing = @()
          foreach ($flag in @(
              @('$<$<CONFIG:Release>:/Zi>', '$<$<CONFIG:Release>:>'),
              @('$<$<CONFIG:Release>:/DEBUG>', '$<$<CONFIG:Release>:>'),
              @('$<$<CONFIG:Release>:/LTCG>', '$<$<CONFIG:Release>:/LTCG:INCREMENTAL>'))) {
            if ($text.Contains($flag[0])) {
              $text = $text.Replace($flag[0], $flag[1])
            } else {
              $missing += $flag[0]
            }
          }
          [IO.File]::WriteAllText($path, $text)
          if ($missing) {
            echo "::warning title=Windows build not cacheable::CMakeLists.txt no longer contains $($missing -join ', '). Update this step (fork issue #25)."
            echo "cacheable=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "cacheable=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build Xenia
        id: build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: C:\ccache
          CCACHE_MAXSIZE: 2G
        run: |-
          echo "BUILD_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          ccache --zero-stats
          python xenia-build.py build --config=Release --target=xenia-app
          $build_result = $LASTEXITCODE
          ccache --show-stats -v
          # More than a tenth compiled: the cache is worth saving for the
          # branches built on this one.
          $stats = @{}
          ccache --print-stats | ForEach-Object {
            $name, $value = $_ -split '\s+'
            $stats[$name] = [int64]$value
          }
          $hits = $stats['direct_cache_hit'] + $stats['preprocessed_cache_hit']
          $misses = [int64]$stats['cache_miss']
          echo "Compiler cache: $hits hits, $misses misses"
          if ($misses * 10 -gt $hits + $misses) {
            echo "cold=true" >> $env:GITHUB_OUTPUT
          }
          Get-ChildItem build\bin\Windows\Release -ErrorAction SilentlyContinue | Format-Table Name, Length
          exit $build_result

      # Fork-only until upstream runs tests (fork issue #5, branch ci/run-tests).
      # PhysicalHeap vE0000000 alignment is excluded: its "alignment larger
      # than page_size is rejected" section contradicts the Linux-excluded
      # AllocRange test and fails here until the #9 fix lands.
      - name: Run tests
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: C:\ccache
          CCACHE_MAXSIZE: 2G
        run: >-
          python xenia-build.py test --config=Release --continue --
          "~PhysicalHeap vE0000000 alignment"

      # Fork-only: upstream CI never builds the misc tools (XENIA_BUILD_MISC),
      # so changes to the code they share with the app break them unnoticed.
      # The GPU trace dumps and viewers are compile-checked here. vfs-dump,
      # the shader compiler and the window demos are already broken upstream
      # and left out until fixed (fork issue #60).
      - name: Build misc tools
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: C:\ccache
          CCACHE_MAXSIZE: 2G
        run: >-
          python xenia-build.py build --config=Release
          --cmake-define XENIA_BUILD_MISC=ON
          --target xenia-gpu-d3d12-trace-dump
          --target xenia-gpu-d3d12-trace-viewer
          --target xenia-gpu-vulkan-trace-dump
          --target xenia-gpu-vulkan-trace-viewer

      # fork-ci builds and cold builds save. Only entries this build used are
      # kept, so the cache doesn't grow with every upstream change, and older
      # entries are deleted to stay under the repository's 10 GB cache limit.
      - name: Trim compiler output
        if: ${{ inputs.save-cache || steps.build.outputs.cold == 'true' }}
        env:
          CCACHE_DIR: C:\ccache
        run: |-
          $age = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $env:BUILD_START + 300
          ccache --evict-older-than "${age}s"
          ccache --show-stats
          Get-ChildItem C:\ccache -File | ForEach-Object { echo "saving: $($_.Name) $($_.Length) bytes" }

      - name: Save compiler output
        if: ${{ inputs.save-cache || steps.build.outputs.cold == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            C:\ccache
            build\bin\Windows\Release\*.iobj
            build\bin\Windows\Release\*.ipdb
          key: ${{ runner.os }}-ccache-v2-${{ inputs.ref }}

      - name: Delete replaced compiler output
        if: ${{ inputs.save-cache || steps.build.outputs.cold == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: ${{ runner.os }}-ccache-v2-
          KEY: ${{ runner.os }}-ccache-v2-${{ inputs.ref }}
          KEEP: ${{ runner.os }}-ccache-v2-${{ inputs.keep-ref }}
        run: |-
          # Keeps this entry, fork-ci's, and the 3 newest others.
          kept=0
          gh api "repos/$REPO/actions/caches?key=$PREFIX&per_page=100&sort=created_at&direction=desc" \
            -q '.actions_caches[] | "\(.id) \(.key)"' |
            while read -r id key; do
              if [ "$key" = "$KEY" ] || [ "$key" = "$KEEP" ]; then
                continue
              fi
              kept=$((kept + 1))
              if [ "$kept" -gt 3 ]; then
                gh api -X DELETE "repos/$REPO/actions/caches/$id" || true
              fi
            done

      - name: Prepare artifacts
        id: prepare_artifacts
        run: |-
          if ((Get-Item "build\bin\Windows\Release\xenia_canary.exe").Length -le 100000) {
            echo "::error:: Executable is too small."
            exit 1
          }
          $path="xenia_canary_windows.7z"
          7z a $path .\build\bin\Windows\Release\xenia_canary.exe LICENSE -mx9 -bb3
          if ((Get-Item "$path").Length -le 100000) {
            echo "::error:: Archive is too small."
            exit 1
          }
          echo "path=$path" >> $env:GITHUB_OUTPUT

      - name: Upload Xenia Canary artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false
