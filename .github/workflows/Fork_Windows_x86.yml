name: Fork Windows Build

# Fork-only copy of Windows_x86.yml, called by Fork_CI.yml. It builds the given
# commit with ccache and incremental LTCG. Keep its steps in sync with
# upstream's Windows_x86.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        required: true
        type: string
    outputs:
      cacheable:
        description: "'false' if the Release flags to rewrite weren't all found"
        value: ${{ jobs.build.outputs.cacheable }}

jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026
    outputs:
      cacheable: ${{ steps.cacheable.outputs.cacheable }}

    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK
          key: ${{ runner.os }}-vulkan-sdk-${{ hashFiles('**/vulkan-sdk.exe') }}
          restore-keys: ${{ runner.os }}-vulkan-sdk-

      - name: Install Vulkan SDK with spirv-tools
        run: |-
          if (Test-Path "C:\VulkanSDK") {
            echo "Vulkan SDK found in cache."
          } else {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
            Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -NoNewWindow -Wait
          }
          $env:VULKAN_SDK = "C:\VulkanSDK\$(Get-ChildItem -Path 'C:\VulkanSDK' -Directory | Select-Object -First 1 -ExpandProperty Name)"
          $env:PATH += "${env:VULKAN_SDK}\Bin"
          echo "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          echo "${env:VULKAN_SDK}\Bin" >> $env:GITHUB_PATH

          # Verify shader tools are available
          foreach ($tool in @("glslangValidator", "spirv-opt", "spirv-dis")) {
            $toolPath = "${env:VULKAN_SDK}\Bin\${tool}.exe"
            if (Test-Path "$toolPath") {
              echo "$tool found at: $toolPath"
              & $toolPath --version 2>$null
            } else {
              echo "Warning: ${tool}.exe not found at expected location"
            }
          }

          # Verify FXC is available (from Windows SDK)
          $fxcPaths = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName
          if ($fxcPaths) {
            $fxcPath = $fxcPaths[-1].FullName
            echo "FXC found at: $fxcPath"
          } else {
            echo "Warning: fxc.exe not found in Windows SDK"
          }

      - name: Download submodules
        run: |- # Exclude unneeded submodules
          $SUBMODULES=(Select-String -CaseSensitive '(?<=path = )(?!third_party\/xbyak_aarch64).+' .gitmodules).Matches.Value
          git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS $SUBMODULES

      - name: Cache compiler output
        uses: actions/cache@v6
        with:
          path: |
            C:\ccache
            build\bin\Windows\Release\*.iobj
            build\bin\Windows\Release\*.ipdb
          key: ${{ runner.os }}-ccache-v2-${{ inputs.ref }}
          restore-keys: ${{ runner.os }}-ccache-v2-

      - name: Install ccache
        env:
          CCACHE_VERSION: 4.11.3
        run: |-
          $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile "$env:RUNNER_TEMP\ccache.zip"
          Expand-Archive "$env:RUNNER_TEMP\ccache.zip" -DestinationPath "$env:RUNNER_TEMP"
          echo "$env:RUNNER_TEMP\$name" >> $env:GITHUB_PATH

      - name: Make Release objects cacheable
        # ccache can't cache /Zi objects, and the artifact ships without a .pdb,
        # so drop Release debug info. Incremental LTCG reuses the cached
        # .iobj/.ipdb files. Rewriting the flags works on any branch, with or
        # without the XENIA_RELEASE_DEBUG_INFO/XENIA_INCREMENTAL_LTCG options.
        # Any flag that isn't found is reported, and Fork_CI.yml notes it in
        # the commit status.
        id: cacheable
        run: |-
          $path = "CMakeLists.txt"
          $text = [IO.File]::ReadAllText($path)
          $missing = @()
          foreach ($flag in @(
              @('$<$<CONFIG:Release>:/Zi>', '$<$<CONFIG:Release>:>'),
              @('$<$<CONFIG:Release>:/DEBUG>', '$<$<CONFIG:Release>:>'),
              @('$<$<CONFIG:Release>:/LTCG>', '$<$<CONFIG:Release>:/LTCG:INCREMENTAL>'))) {
            if ($text.Contains($flag[0])) {
              $text = $text.Replace($flag[0], $flag[1])
            } else {
              $missing += $flag[0]
            }
          }
          [IO.File]::WriteAllText($path, $text)
          if ($missing) {
            echo "::warning title=Windows build not cacheable::CMakeLists.txt no longer contains $($missing -join ', '). Update this step (fork issue #25)."
            echo "cacheable=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "cacheable=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build Xenia
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: C:\ccache
          CCACHE_MAXSIZE: 2G
        run: |-
          ccache --zero-stats
          python xenia-build.py build --config=Release --target=xenia-app
          $build_result = $LASTEXITCODE
          ccache --show-stats -v
          Get-ChildItem build\bin\Windows\Release -ErrorAction SilentlyContinue | Format-Table Name, Length
          exit $build_result

      # Fork-only until upstream runs tests (fork issue #5, branch ci/run-tests).
      # PhysicalHeap vE0000000 alignment is excluded: its "alignment larger
      # than page_size is rejected" section contradicts the Linux-excluded
      # AllocRange test and fails here until the #9 fix lands.
      - name: Run tests
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: C:\ccache
          CCACHE_MAXSIZE: 2G
        run: >-
          python xenia-build.py test --config=Release --continue --
          "~PhysicalHeap vE0000000 alignment"

      - name: Prepare artifacts
        id: prepare_artifacts
        run: |-
          if ((Get-Item "build\bin\Windows\Release\xenia_canary.exe").Length -le 100000) {
            echo "::error:: Executable is too small."
            exit 1
          }
          $path="xenia_canary_windows.7z"
          7z a $path .\build\bin\Windows\Release\xenia_canary.exe LICENSE -mx9 -bb3
          if ((Get-Item "$path").Length -le 100000) {
            echo "::error:: Archive is too small."
            exit 1
          }
          echo "path=$path" >> $env:GITHUB_OUTPUT

      - name: Upload Xenia Canary artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false
