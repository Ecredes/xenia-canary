name: Fork Linux Build

# Fork-only copy of Linux_x86.yml, called by Fork_CI.yml. It builds the given
# commit with ccache and a ThinLTO cache. Keep its steps in sync with upstream's
# Linux_x86.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        required: true
        type: string
      save-cache:
        description: 'Save the compiler cache (fork-ci builds only)'
        required: true
        type: boolean

env:
  LLVM_VERSION: 20

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk-linux
        uses: actions/cache@v6
        with:
          path: ~/vulkan-sdk
          key: ${{ runner.os }}-vulkan-sdk-latest

      # Restored by every build, saved only by fork-ci builds (see "Save
      # compiler output" below, fork issue #29).
      - name: Restore compiler output
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.ccache
            ~/.cache/thinlto
          key: ${{ runner.os }}-ccache-${{ inputs.ref }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Cache linuxdeploy tools
        id: cache-linuxdeploy
        uses: actions/cache@v6
        with:
          path: ~/linuxdeploy
          key: ${{ runner.os }}-linuxdeploy-tools

      - name: Setup build environment
        run: |-
          UBUNTU_BASE=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-${{ env.LLVM_VERSION }} main"
          sudo apt-get -y update
          sudo apt-get -y install mesa-vulkan-drivers valgrind libc++-dev libc++abi-dev libgtk-3-dev libsdl2-dev libvulkan-dev libx11-xcb-dev ccache clang-${{ env.LLVM_VERSION }} lld-${{ env.LLVM_VERSION }} spirv-tools libfuse2

          # Pin LLVM tools to the correct version so system ar/ranlib/lld
          # don't use the older LLVM 17 gold plugin with clang-20 LTO bitcode
          sudo update-alternatives --install /usr/bin/clang      clang      /usr/bin/clang-${{ env.LLVM_VERSION }}      200
          sudo update-alternatives --install /usr/bin/clang++    clang++    /usr/bin/clang++-${{ env.LLVM_VERSION }}    200
          sudo update-alternatives --install /usr/bin/lld        lld        /usr/bin/lld-${{ env.LLVM_VERSION }}        200
          sudo update-alternatives --install /usr/bin/ld.lld     ld.lld     /usr/bin/ld.lld-${{ env.LLVM_VERSION }}     200
          sudo update-alternatives --install /usr/bin/llvm-ar    llvm-ar    /usr/bin/llvm-ar-${{ env.LLVM_VERSION }}    200
          sudo update-alternatives --install /usr/bin/llvm-ranlib llvm-ranlib /usr/bin/llvm-ranlib-${{ env.LLVM_VERSION }} 200
          sudo update-alternatives --install /usr/bin/llvm-nm    llvm-nm    /usr/bin/llvm-nm-${{ env.LLVM_VERSION }}    200

          # Download linuxdeploy tools if not cached
          if [ "${{ steps.cache-linuxdeploy.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/linuxdeploy
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O ~/linuxdeploy/linuxdeploy
            chmod +x ~/linuxdeploy/linuxdeploy
          fi
          echo "${HOME}/linuxdeploy" >> $GITHUB_PATH

      - name: Install Vulkan SDK
        run: |-
          if [ "${{ steps.cache-vulkan-sdk-linux.outputs.cache-hit }}" != "true" ]; then
            wget -qO vulkan-sdk.tar.xz https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz
            mkdir -p ~/vulkan-sdk
            tar -xf vulkan-sdk.tar.xz -C ~/vulkan-sdk
          fi

          VULKAN_SDK_VERSION=$(ls ~/vulkan-sdk)
          echo "VULKAN_SDK=${HOME}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64" >> $GITHUB_ENV
          echo "${HOME}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin" >> $GITHUB_PATH

          # Verify shader tools are available
          for tool in glslangValidator spirv-opt spirv-dis; do
            which "$tool" && "$tool" --version 2>/dev/null || echo "Warning: $tool not found"
          done

      - name: Download submodules
        run: |- # Exclude unneeded submodules
          SUBMODULES=$(grep -oP '(?<=path = )(?!third_party\/(?:DirectX(?:-Headers|ShaderCompiler)|xbyak_aarch64)).+' .gitmodules)
          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $SUBMODULES

      - name: Build Xenia
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 2G
        run: |-
          export CCACHE_DIR=$HOME/.ccache
          # ThinLTO code generation runs at link time; cache it too. Release links
          # with lld anyway, and CMake's compiler check needs it for the flag.
          export LDFLAGS="-fuse-ld=lld -Wl,--thinlto-cache-dir=$HOME/.cache/thinlto"
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          ccache --zero-stats
          ./xenia-build.py build --config=Release
          ccache --show-stats
          du -sh ~/.ccache ~/.cache/thinlto || true

      # Fork-only until upstream runs tests (fork issue #5, branch ci/run-tests).
      # PhysicalHeap vE0000000 AllocRange alignment is excluded: it fails on
      # Linux until PhysicalHeap::AllocRange checks the physical address (fork
      # issue #9, branch memory/physical-heap-alignment).
      - name: Run tests
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 2G
        run: |-
          export CCACHE_DIR=$HOME/.ccache
          export LDFLAGS="-fuse-ld=lld -Wl,--thinlto-cache-dir=$HOME/.cache/thinlto"
          ccache --zero-stats
          ./xenia-build.py test --config=Release --continue -- \
            "~PhysicalHeap vE0000000 AllocRange alignment"

      # Only entries this build used are kept, and the entries this save
      # replaces are deleted, as in Fork_Windows_x86.yml.
      - name: Trim compiler output
        if: ${{ inputs.save-cache }}
        run: |-
          export CCACHE_DIR=$HOME/.ccache
          ccache --evict-older-than "$(( $(date +%s) - BUILD_START + 300 ))s"
          ccache --show-stats

      - name: Save compiler output
        if: ${{ inputs.save-cache }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.ccache
            ~/.cache/thinlto
          key: ${{ runner.os }}-ccache-${{ inputs.ref }}

      - name: Delete replaced compiler output
        if: ${{ inputs.save-cache }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: ${{ runner.os }}-ccache-
          KEY: ${{ runner.os }}-ccache-${{ inputs.ref }}
        run: |-
          gh api "repos/$REPO/actions/caches?key=$PREFIX&per_page=100" \
            -q ".actions_caches[] | select(.key != \"$KEY\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$REPO/actions/caches/$id" || true
            done

      - name: Prepare AppImage
        id: prepare_artifacts
        run: |-
          binary=build/bin/Linux/Release/xenia_canary
          if [ $(stat -c%s $binary) -le 100000 ]; then
            echo "::error::Binary is too small."
            exit 1
          fi
          chmod +x $binary

          # Set up AppDir structure
          APPDIR=artifacts/xenia_canary
          mkdir -p ${APPDIR}/usr/bin
          # Install icons
          for size in 16 32 48 64 128 256 512 1024; do
            mkdir -p ${APPDIR}/usr/share/icons/hicolor/${size}x${size}/apps
            cp assets/icon/${size}.png ${APPDIR}/usr/share/icons/hicolor/${size}x${size}/apps/xenia_canary.png
          done

          # Copy any extra runtime data directories alongside the binary
          find build/bin/Linux/Release -maxdepth 1 -type d ! -name Release -exec cp -r {} ${APPDIR}/usr/bin/ \;

          # Build AppImage with linuxdeploy (requires absolute paths)
          linuxdeploy --appdir $APPDIR \
            --executable $binary \
            --desktop-file ${GITHUB_WORKSPACE}/assets/xenia_canary.desktop \
            --icon-file ${GITHUB_WORKSPACE}/assets/icon/256.png \
            --output appimage

          # Find the generated AppImage and move to release directory
          appimage_file=$(ls -1 *.AppImage | head -n1)
          if [ -z "$appimage_file" ]; then
            echo "::error::AppImage file not found after linuxdeploy"
            exit 1
          fi

          chmod +x "$appimage_file"
          artifact=xenia_canary_linux.AppImage
          mv "$appimage_file" $artifact
          echo "path=$artifact" >> $GITHUB_OUTPUT

      - name: Upload Xenia Canary artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false
